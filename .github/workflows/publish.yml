name: 'publish'

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

jobs:

  linux:
    uses: ./.github/workflows/build_linux.yml
    with:
      target: editor

  windows-online:
    uses: ./.github/workflows/build_windows.yml
    with:
      target: editor
      build: windows - online

  windows-offline:
    uses: ./.github/workflows/build_windows.yml
    with:
      target: editor
      build: windows - offline

  android:
    uses: ./.github/workflows/publish_android.yml
    with:
      target: editor
