name: 'build_linux'

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Application to build'
        required: true
        default: 'editor'
        type: choice
        options:
          - editor
          - player

      publish:
        description: 'Publish GitHub release'
        required: true
        default: false
        type: boolean

  workflow_call:
    inputs:
      target:
        description: 'Application to build'
        required: true
        type: string

      publish:
        required: true
        type: boolean

jobs:
  publish-tauri:
    permissions:
      contents: write

    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - name: install dependencies (ubuntu only)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 26.1.0
          cache: pnpm

      - name: Setup Rust target directory
        run: |
          echo "CARGO_TARGET_DIR=${{ github.workspace }}/target/${{ inputs.target }}" >> $GITHUB_ENV

      - name: install frontend dependencies
        run: pnpm install

      # --------------------
      # Build
      # --------------------

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/lifecompanion/src-tauri/${{ inputs.target }}
          args: --config tauri.conf.json
          tagName: linux-${{ inputs.target }}-v__VERSION__
          releaseName: 'linux-${{ inputs.target }}-v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          uploadWorkflowArtifacts: ${{ inputs.publish }}
          uploadUpdaterJson: ${{ inputs.publish }}
          releaseDraft: ${{ inputs.publish }}

