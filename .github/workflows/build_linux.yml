name: 'build_linux'

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Application to build'
        required: true
        default: 'editor'
        type: choice
        options:
          - editor
          - player

  workflow_call:
    inputs:
      target:
        description: 'Application to build'
        required: true
        type: string

jobs:
  build:

    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup build environment
        uses: ./.github/actions/setup_build
        with:
          tauri-signing-private-key: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          tauri-signing-private-key-password: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # --------------------
      # Build
      # --------------------

      - name: Build Linux
        run: make build-linux target=${{ inputs.target }} bundle=true release=true

      # --------------------
      # Store artifact
      # --------------------

      - name: Store linux as artifact
        uses: actions/upload-artifact@v4
        with:
          name: lifecompanion-${{ inputs.target }}-linux
          path: |
            target/lifecompanion-${{ inputs.target }}/release/bundle/deb/*.deb
            target/lifecompanion-${{ inputs.target }}/release/bundle/rpm/*.rpm
            target/lifecompanion-${{ inputs.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: error
