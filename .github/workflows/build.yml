name: 'build'

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'windows'
        type: choice
        options:
          - windows
          - linux
          - android

jobs:
  build:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: linux

          - runner: ubuntu-22.04
            target: windows

          - runner: ubuntu-22.04
            target: android

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Set Docker UID/GID
        run: |
          echo "UID=$(id -u)" >> "$GITHUB_ENV"
          echo "GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Build Linux
        if:  matrix.platform == 'ubuntu-22.04' && matrix.target == 'linux'
        run: make build-linux target=editor bundle=true release=true

      - name: Build Windows
        if: matrix.platform == 'ubuntu-22.04' && matrix.target == 'windows'
        run: make build-windows target=editor bundle=true release=true

      - name: Build Android
        if: matrix.platform == 'ubuntu-22.04' && matrix.target == 'android'
        run: make build-android target=editor release=true

      - name: Upload Linux artifacts
        if: matrix.platform == 'ubuntu-22.04' && matrix.target == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: lifecompanion-editor-linux
          path: |
            target/lifecompanion-editor/release/bundle/deb/*.deb
            target/lifecompanion-editor/release/bundle/rpm/*.rpm
            target/lifecompanion-editor/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Upload Windows artifacts
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: lifecompanion-editor-windows
          path: target/lifecompanion-editor/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

      - name: Upload Android artifacts
        if: matrix.target == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: lifecompanion-editor-android
          path: apps/lifecompanion/src-tauri/editor/gen/android/app/build/outputs/apk/universal/debug/*.apk
          if-no-files-found: error
