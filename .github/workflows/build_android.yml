name: 'build_android'

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Application to build'
        required: true
        default: 'editor'
        type: choice
        options:
          - editor
          - player
      build:
        description: 'Build type'
        required: true
        default: 'apk'
        type: choice
        options:
          - apk
          - aab
      status:
        description: 'Build status'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug


  workflow_call:
    inputs:
      target:
        description: 'Application to build'
        required: true
        type: string
      build:
        description: 'Build type'
        required: true
        type: string
      status:
        description: 'Build status'
        required: true
        type: string

jobs:
  build_android:
    permissions:
      contents: write

    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - name: install dependencies (ubuntu only)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev

      - name: setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.x.x

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 26.x.0
          cache: pnpm

      - name: install frontend dependencies
        run: pnpm install

      - name: install Rust stable (android)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29
          link-to-sdk: true

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './apps/lifecompanion/src-tauri/${{ inputs.target }} -> ../../target'

      - name: Setup Rust target directory
        run: |
          echo "CARGO_TARGET_DIR=${{ github.workspace }}/apps/lifecompanion/src-tauri/${{ inputs.target }}" >> $GITHUB_ENV

      - name: init mobile project
        run: |
          cd apps/lifecompanion/src-tauri/editor
          pnpm dlx @tauri-apps/cli android init

      - name: Setup Android signing
        run: |
          cd apps/lifecompanion/src-tauri/${{ inputs.target }}/gen/android
          echo "keyAlias=${{ secrets.TAURI_ANDROID_KEY_ALIAS }}" > keystore.properties
          echo "password=${{ secrets.TAURI_ANDROID_KEY_PASSWORD }}" >> keystore.properties
          base64 -d <<< "${{ secrets.TAURI_ANDROID_KEY_BASE64 }}" > $RUNNER_TEMP/keystore.jks
          echo "storeFile=$RUNNER_TEMP/keystore.jks" >> keystore.properties

      # --------------------
      # Build and Save Artifacts
      # --------------------

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        with:
          projectPath: apps/lifecompanion/src-tauri/${{ inputs.target }}

          releaseDraft: false

          uploadWorkflowArtifacts: true
          uploadUpdaterSignatures: false

          args: '--${{ inputs.build }} --${{ inputs.status }}'

          mobile: 'android'
