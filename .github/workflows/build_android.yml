name: 'build_android'

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Application to build'
        required: true
        default: 'editor'
        type: choice
        options:
          - editor
          - player
      build:
        description: 'Build type'
        required: true
        default: 'apk'
        type: choice
        options:
          - apk
          - aab

  workflow_call:
    inputs:
      target:
        description: 'Application to build'
        required: true
        type: string
      build:
        description: 'Build type'
        required: true
        type: string

jobs:
  build_linux:
    permissions:
      contents: write

    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - name: install dependencies (ubuntu only)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 26.1.0
          cache: pnpm

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './apps/lifecompanion/src-tauri/${{ inputs.target }} -> target'

      - name: install frontend dependencies
        run: pnpm install

      # --------------------
      # Build and Save Artifacts
      # --------------------

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/lifecompanion/src-tauri/${{ inputs.target }}

          releaseDraft: false

          uploadWorkflowArtifacts: true
          uploadUpdaterSignatures: false

          args: ''

          mobile: 'android'
