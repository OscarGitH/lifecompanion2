name: 'build_android'

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Application to build'
        required: true
        default: 'editor'
        type: choice
        options:
          - editor
          - player

      build:
        description: 'Build type'
        required: true
        default: 'apk'
        type: choice
        options:
          - apk
          - aab

  workflow_call:
    inputs:
      target:
        description: 'Application to build'
        required: true
        type: string
      build:
        description: 'Build type'
        required: true
        type: string

jobs:
  publish-tauri:
    permissions:
      contents: write

    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 26.1.0
          cache: pnpm

      - name: Setup Rust target directory
        run: |
          echo "CARGO_TARGET_DIR=${{ github.workspace }}/target/${{ inputs.target }}" >> $GITHUB_ENV

      # Cache Rust dependencies and build artifacts between GitHub Actions runs to reduce build time.
      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: install frontend dependencies
        run: pnpm install

      - name: Setup Android signing
        run: |
          cd apps/lifecompanion/src-tauri/${{ inputs.target }}/gen/android
          echo "keyAlias=${{ secrets.TAURI_ANDROID_KEY_ALIAS }}" > keystore.properties
          echo "password=${{ secrets.TAURI_ANDROID_KEY_PASSWORD }}" >> keystore.properties
          base64 -d <<< "${{ secrets.TAURI_ANDROID_KEY_BASE64 }}" > $RUNNER_TEMP/keystore.jks
          echo "storeFile=$RUNNER_TEMP/keystore.jks" >> keystore.properties

      # --------------------
      # Build
      # --------------------

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/lifecompanion/src-tauri/${{ inputs.target }}
          args: --config tauri.conf.json
          tagName: android-${{ inputs.target }}-v__VERSION__
          releaseName: 'android-${{ inputs.target }}-v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          uploadWorkflowArtifacts: true
          uploadUpdaterJson: true
          releaseDraft: true
          prerelease: false
          uploadPlainBinary: false
