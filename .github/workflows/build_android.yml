name: 'build_android'

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Application to build'
        required: true
        default: 'editor'
        type: choice
        options:
          - editor
          - player

      build:
        description: 'Build type'
        required: true
        default: 'apk'
        type: choice
        options:
          - apk
          - aab

      mode:
        description: 'Build mode'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release

  workflow_call:
    inputs:
      target:
        description: 'Application to build'
        required: true
        type: string
      build:
        description: 'Build type'
        required: true
        type: string
      mode:
        description: 'Build mode'
        required: true
        type: string

jobs:
  publish-tauri:
    permissions:
      contents: write

    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 26.1.0
          cache: pnpm

      - name: Setup Rust target directory
        run: |
          echo "CARGO_TARGET_DIR=${{ github.workspace }}/target/${{ inputs.target }}" >> $GITHUB_ENV

      - name: install frontend dependencies
        run: pnpm install

      - name: Setup Android signing
        run: |
          cd apps/lifecompanion/src-tauri/${{ inputs.target }}/gen/android
          echo "keyAlias=${{ secrets.TAURI_ANDROID_KEY_ALIAS }}" > keystore.properties
          echo "password=${{ secrets.TAURI_ANDROID_KEY_PASSWORD }}" >> keystore.properties
          base64 -d <<< "${{ secrets.TAURI_ANDROID_KEY_BASE64 }}" > $RUNNER_TEMP/keystore.jks
          echo "storeFile=$RUNNER_TEMP/keystore.jks" >> keystore.properties

      - name: Setup build arguments
        shell: bash
        run: |
          if [ "${{ inputs.build }}" = "aab" ]; then
            echo "TAURI_ANDROID_PACKAGE=--aab" >> $GITHUB_ENV
          else
            echo "TAURI_ANDROID_PACKAGE=--apk" >> $GITHUB_ENV
          fi
          
          if [ "${{ inputs.mode }}" = "release" ]; then
            echo "TAURI_ANDROID_MODE=--release" >> $GITHUB_ENV
          else
            echo "TAURI_ANDROID_MODE=--debug" >> $GITHUB_ENV
          fi

      # --------------------
      # Build
      # --------------------

      - name: Build Android
        working-directory: apps/lifecompanion/src-tauri/${{ inputs.target }}
        run: |
          pnpm exec tauri android build \
            ${{ env.TAURI_ANDROID_PACKAGE }} \
            ${{ env.TAURI_ANDROID_MODE }}

      - name: Upload Android artifact
        uses: actions/upload-artifact@v5
        with:
          name: android-${{ inputs.build }}-${{ inputs.target }}
          path: |
            apps/lifecompanion/src-tauri/${{ inputs.target }}/gen/android/app/build/outputs/**/*.apk
            apps/lifecompanion/src-tauri/${{ inputs.target }}/gen/android/app/build/outputs/**/*.aab