name: 'build_android'

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Application to build'
        required: true
        default: 'editor'
        type: choice
        options:
          - editor
          - player

      build:
        description: 'Build type'
        required: true
        default: 'apk'
        type: choice
        options:
          - apk
          - aab

      publish:
        description: 'Publish GitHub release'
        required: true
        default: false
        type: boolean

  workflow_call:
    inputs:
      target:
        description: 'Application to build'
        required: true
        type: string
      build:
        description: 'Build type'
        required: true
        type: string
      publish:
        required: true
        type: boolean

jobs:
  publish-tauri:
    permissions:
      contents: write

    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - name: install dependencies (ubuntu only)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 26.1.0
          cache: pnpm

      - name: Setup Rust target directory
        run: |
          echo "CARGO_TARGET_DIR=${{ github.workspace }}/target/${{ inputs.target }}" >> $GITHUB_ENV

      - name: install frontend dependencies
        run: pnpm install

      - name: Setup Android signing
        run: |
          cd apps/lifecompanion/src-tauri/${{ inputs.target }}/gen/android
          echo "keyAlias=${{ secrets.TAURI_ANDROID_KEY_ALIAS }}" > keystore.properties
          echo "password=${{ secrets.TAURI_ANDROID_KEY_PASSWORD }}" >> keystore.properties
          base64 -d <<< "${{ secrets.TAURI_ANDROID_KEY_BASE64 }}" > $RUNNER_TEMP/keystore.jks
          echo "storeFile=$RUNNER_TEMP/keystore.jks" >> keystore.properties

      - name: Setup build arguments
        shell: bash
        run: |
          if [ "${{ inputs.package }}" = "aab" ]; then
            echo "TAURI_ANDROID_PACKAGE=--aab" >> $GITHUB_ENV
          else
            echo "TAURI_ANDROID_PACKAGE=--apk" >> $GITHUB_ENV
          fi
          
          if [ "${{ inputs.publish }}" = "true" ]; then
            echo "TAURI_ANDROID_MODE=--release" >> $GITHUB_ENV
          else
            echo "TAURI_ANDROID_MODE=--debug" >> $GITHUB_ENV
          fi

      # --------------------
      # Build
      # --------------------

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/lifecompanion/src-tauri/${{ inputs.target }}
          args: android build ${{ env.TAURI_ANDROID_PACKAGE }} ${{ env.TAURI_ANDROID_MODE }}
          tagName: android-${{ inputs.target }}-v__VERSION__
          releaseName: 'android-${{ inputs.target }}-v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          uploadWorkflowArtifacts: ${{ inputs.publish }}
          uploadUpdaterJson: ${{ inputs.publish }}
          releaseDraft: ${{ inputs.publish }}

