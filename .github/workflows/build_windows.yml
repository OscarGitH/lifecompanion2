name: 'build_windows'

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Application to build'
        required: true
        default: 'editor'
        type: choice
        options:
          - editor
          - player

      build:
        description: 'Build type'
        required: true
        default: 'online'
        type: choice
        options:
          - online
          - offline

  workflow_call:
    inputs:
      target:
        description: 'Application to build'
        required: true
        type: string
      build:
        description: 'Build type'
        required: true
        type: string

jobs:
  build:

    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/lifecompanion/src-tauri/${{ inputs.target }} -> target

      - name: install frontend dependencies
        run: pnpm install

      # --------------------
      # Build
      # --------------------

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/lifecompanion/src-tauri/${{ inputs.target }}
          args: --config tauri.windows-${{ inputs.build }}.conf.json
          tagName: windows-${{ inputs.build }}-${{ inputs.target }}-v__VERSION__
          releaseName: 'windows-${{ inputs.build }}-${{ inputs.target }}-v__VERSION__'
          workflowArtifactNamePattern: 'windows-${{ inputs.build }}-${{ inputs.target }}-v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          uploadWorkflowArtifacts: true
          releaseDraft: false
          prerelease: false
          uploadPlainBinary: false
          uploadUpdaterJson: true

