name: 'build_windows'

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Application to build'
        required: true
        default: 'editor'
        type: choice
        options:
          - editor
          - player

      build:
        description: 'Build type'
        required: true
        default: 'windows - online'
        type: choice
        options:
          - windows - online
          - windows - offline

  workflow_call:
    inputs:
      target:
        description: 'Application to build'
        required: true
        type: string
      build:
        description: 'Build type'
        required: true
        type: string

jobs:
  build:

    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup build environment
        uses: ./.github/actions/setup_build_ubuntu

      # --------------------
      # Build
      # --------------------

      - name: Build Windows Online
        if: inputs.build == 'windows - online'
        run: make build-windows target=${{ inputs.target }} windows_variant=online bundle=true release=true

      - name: Build Windows Offline
        if: inputs.build == 'windows - offline'
        run: make build-windows target=${{ inputs.target }} windows_variant=offline bundle=true release=true

      # --------------------
      # Store artifact
      # --------------------

      - name: Store Windows Online as artifact
        if: inputs.build == 'windows - online'
        uses: actions/upload-artifact@v4
        with:
          name: lifecompanion-${{ inputs.target }}-windows-online
          path: target/lifecompanion-${{ inputs.target }}/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

      - name: Store Windows Offline as artifact
        if: inputs.build == 'windows - offline'
        uses: actions/upload-artifact@v4
        with:
          name: lifecompanion-${{ inputs.target }}-windows-offline
          path: target/lifecompanion-${{ inputs.target }}/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error


