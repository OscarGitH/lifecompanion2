name: 'publish_android'

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Application to build'
        required: true
        default: 'editor'
        type: choice
        options:
          - editor
          - player

  workflow_call:
    inputs:
      target:
        description: 'Application to build'
        required: true
        type: string

jobs:
  build:

    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - name: setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 26.1.0
          cache: pnpm

      - name: install dependencies (ubuntu only)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: install frontend dependencies
        run: pnpm install

      - name: Setup Android signing
        run: |
          cd apps/lifecompanion/src-tauri/${{ inputs.target }}/gen/android
          echo "keyAlias=${{ secrets.TAURI_ANDROID_KEY_ALIAS }}" > keystore.properties
          echo "password=${{ secrets.TAURI_ANDROID_KEY_PASSWORD }}" >> keystore.properties
          base64 -d <<< "${{ secrets.TAURI_ANDROID_KEY_BASE64 }}" > $RUNNER_TEMP/keystore.jks
          echo "storeFile=$RUNNER_TEMP/keystore.jks" >> keystore.properties

      # --------------------
      # Build
      # --------------------

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/lifecompanion/src-tauri/${{ inputs.target }}
          args: --config tauri.android-${{ inputs.build }}.conf.json
          tagName: android-${{ inputs.build }}-${{ inputs.target }}-v__VERSION__
          releaseName: 'android-${{ inputs.build }}-${{ inputs.target }}-v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          uploadWorkflowArtifacts: true
          uploadUpdaterJson: true
          releaseDraft: true
          prerelease: false
          uploadPlainBinary: false

      # --------------------
      # Deploy to Google Play
      # --------------------

      - name: Deploy to Google Play
        if: github.ref_type == 'tag'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          packageName: org.lifecompanion2.${{ inputs.target }}
          releaseFiles: apps/lifecompanion/src-tauri/${{ inputs.target }}/gen/android/app/build/outputs/bundle/universalRelease/*.aab
          track: ${{ env.TRACK }}
        env:
          TRACK: ${{ steps.publication.outputs.APP_TRACK }}
