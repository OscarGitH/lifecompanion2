name: setup_build
description: Setup common LifeCompanion build environment

inputs:
  target:
    description: Application to build (player or editor)
    required: true
  tauri-signing-private-key:
    description: Tauri signing private key
    required: true
  tauri-signing-private-key-password:
    description: Tauri signing password
    required: true

runs:
  using: composite
  steps:
    - name: setup node
      shell: bash
      uses: actions/setup-node@v6
      with:
        node-version: lts/*
        cache: pnpm

    - name: Rust cache
      shell: bash
      uses: swatinem/rust-cache@v2
      with:
        workspaces: apps/lifecompanion/src-tauri/${{ inputs.target }} -> target

    - name: install frontend dependencies
      shell: bash
      run: pnpm install


    - name: Setup Tauri signing
      shell: bash
      env:
        TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.tauri-signing-private-key }}
        TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.tauri-signing-private-key-password }}
      run: |
        cat > .env <<EOF
        TAURI_SIGNING_PRIVATE_KEY=$TAURI_SIGNING_PRIVATE_KEY
        TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$TAURI_SIGNING_PRIVATE_KEY_PASSWORD
        EOF